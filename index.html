<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>ZY Smart Gold Signals</title>
  <link rel="stylesheet" href="styles.css" />
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    body { font-family: Arial, sans-serif; background: #0b0b0b; color: #f1f1f1; text-align: center; padding: 20px; }
    .card { background: #161616; border-radius: 12px; padding: 15px; margin: 10px auto; max-width: 400px; }
    .brand { font-size: 1.3em; font-weight: bold; color: gold; }
    canvas { width: 100%; height: 250px; }
  </style>
</head>
<body>
  <div class="brand">ZY Smart Gold & Oil Signals</div>
  <div id="timeRow"></div>

  <div class="card">
    <h3>Gold Price (USD/oz)</h3>
    <p id="gold">Loading...</p>
    <canvas id="goldChart"></canvas>
  </div>

  <div class="card">
    <h3>Oil Price (USD/barrel)</h3>
    <p id="oil">Loading...</p>
    <canvas id="oilChart"></canvas>
  </div>

  <div class="card">Last update: <span id="lastUpdate">-</span></div>

<script>
let goldHistory = [];
let oilHistory = [];

const goldChartCtx = document.getElementById('goldChart').getContext('2d');
const oilChartCtx = document.getElementById('oilChart').getContext('2d');

const goldChart = new Chart(goldChartCtx, {
  type: 'line',
  data: { labels: [], datasets: [{ label: 'Gold', data: [], borderColor: 'gold', tension: 0.3 }] },
});

const oilChart = new Chart(oilChartCtx, {
  type: 'line',
  data: { labels: [], datasets: [{ label: 'Oil', data: [], borderColor: 'orange', tension: 0.3 }] },
});

async function updatePrices() {
  try {
    const res = await fetch('https://api.metals.live/v1/spot');
    const data = await res.json();
    const gold = data.find(x => x.gold);
    const oil = data.find(x => x.oil);

    const now = new Date().toLocaleTimeString();

    if (gold) {
      document.getElementById('gold').innerText = gold.gold + ' USD';
      goldHistory.push({ time: now, price: gold.gold });
      if (goldHistory.length > 10) goldHistory.shift();
      goldChart.data.labels = goldHistory.map(p => p.time);
      goldChart.data.datasets[0].data = goldHistory.map(p => p.price);
      goldChart.update();
    }

    if (oil) {
      document.getElementById('oil').innerText = oil.oil + ' USD';
      oilHistory.push({ time: now, price: oil.oil });
      if (oilHistory.length > 10) oilHistory.shift();
      oilChart.data.labels = oilHistory.map(p => p.time);
      oilChart.data.datasets[0].data = oilHistory.map(p => p.price);
      oilChart.update();
    }

    document.getElementById('lastUpdate').innerText = now;
    document.getElementById('timeRow').innerText = new Date().toUTCString();

  } catch (e) {
    document.getElementById('gold').innerText = 'Error loading data';
    document.getElementById('oil').innerText = 'Error loading data';
  }
}

updatePrices();
setInterval(updatePrices, 15000);
</script>
</body>
</html>
