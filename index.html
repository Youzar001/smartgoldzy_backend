
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>GoldZY — Live Signals</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#070707; --panel:#0f1113; --muted:#9aa1a6; --gold:#d4af37;
    --green:#28c76f; --red:#ff6b6b; --accent:#9b7b2e;
  }
  *{box-sizing:border-box}
  body{margin:0;font-family:Inter,system-ui,Arial;background:var(--bg);color:#eef0f1}
  .wrap{max-width:980px;margin:18px auto;padding:12px}
  .top{display:flex;align-items:center;justify-content:space-between}
  .brand{font-weight:700;color:var(--gold);font-size:18px}
  .controls{display:flex;gap:8px}
  .btn{background:transparent;border:1px solid rgba(255,255,255,0.03);padding:8px 10px;border-radius:8px;color:var(--muted);cursor:pointer}
  .timeRow{color:var(--muted);margin-top:10px}
  .banner{margin:14px 0;padding:12px;border-radius:10px;background:linear-gradient(90deg,rgba(212,175,55,0.06),transparent);display:flex;justify-content:space-between;align-items:center}
  .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px;margin-top:12px}
  .card{background:var(--panel);padding:12px;border-radius:12px;border:1px solid rgba(255,255,255,0.03)}
  .symbol{font-weight:700}
  .name{color:var(--muted);font-size:13px}
  .price{font-size:20px;font-weight:700;margin-top:6px}
  .direction{display:inline-block;padding:6px 10px;border-radius:8px;font-weight:700;color:#fff}
  .buy{background:var(--green)}
  .sell{background:var(--red)}
  .wait{background:#6b6b6b}
  .metrics{margin-top:8px;color:var(--muted);font-size:13px}
  .indicators{margin-top:8px;color:var(--muted);font-size:13px}
  .charts{margin-top:10px;height:120px}
  .footer{display:flex;justify-content:space-between;align-items:center;margin-top:14px;color:var(--muted)}
  .small{font-size:13px;color:var(--muted)}
  /* responsive */
  @media (max-width:520px){ .brand{font-size:16px} .price{font-size:18px} }
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <div class="brand">GoldZY — Smart Signals</div>
    <div class="controls">
      <button id="langBtn" class="btn">EN/AR</button>
      <button id="safeBtn" class="btn">Safe Mode</button>
    </div>
  </div>

  <div class="timeRow" id="timeRow">--</div>

  <div class="banner" id="whaleBanner" aria-live="polite">
    <div id="whaleText">Market Normal</div>
    <div class="small" id="lastUpdate">Last update: -</div>
  </div>

  <div class="grid" id="grid">
    <!-- Cards will populate -->
  </div>

  <div class="footer">
    <div class="small">Powered by ZY AI System</div>
    <div class="small" id="statusText">Status: Connected</div>
  </div>
</div>

<!-- Chart.js CDN -->
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<script>
/*
 Single-file live demo:
 - Sources:
    - Crypto via CoinGecko (no key)
    - Gold & Oil via metals.live (no key)
 - Updates every 15s
 - BUY/SELL heuristic: compare current vs short-term average and percent change
 - Whale detection: spikes in price change magnitude (simple heuristic)
 - No API keys exposed
*/

// Symbols config
const ITEMS = [
  { id: 'gold', label: 'XAU/USD', source: 'metals', key: 'gold' },
  { id: 'oil', label: 'Crude Oil', source: 'metals', key: 'oil' },
  { id: 'btc', label: 'BTC/USD', source: 'coingecko', key: 'bitcoin' },
  { id: 'eur', label: 'EUR/USD', source: 'fxdummy', key: 'EURUSD' } // we'll derive EUR with CoinGecko via USD/EUR inverse
];

const REFRESH_MS = 15000;
const history = {}; // store arrays for mini-charts
for(const it of ITEMS) history[it.id] = [];

const grid = document.getElementById('grid');
const timeRow = document.getElementById('timeRow');
const lastUpdate = document.getElementById('lastUpdate');
const whaleBanner = document.getElementById('whaleBanner');
const whaleText = document.getElementById('whaleText');
const statusText = document.getElementById('statusText');

// Create UI cards
function createCards(){
  grid.innerHTML = '';
  for(const it of ITEMS){
    const card = document.createElement('div'); card.className='card'; card.id='card-'+it.id;
    card.innerHTML = `
      <div class="symbol">${it.label}</div>
      <div class="name">${it.label}</div>
      <div class="price" id="${it.id}-price">Loading...</div>
      <div class="direction" id="${it.id}-dir">—</div>
      <div class="metrics small" id="${it.id}-metrics">—</div>
      <div class="indicators small" id="${it.id}-inds">—</div>
      <canvas id="${it.id}-chart" class="charts"></canvas>
    `;
    grid.appendChild(card);
    // init empty history
    history[it.id] = [];
  }
}
createCards();

// Chart objects
const charts = {};
function initCharts(){
  for(const it of ITEMS){
    const ctx = document.getElementById(it.id+'-chart').getContext('2d');
    charts[it.id] = new Chart(ctx, {
      type: 'line',
      data: { labels: [], datasets: [{ label: it.label, data: [], borderColor: it.id==='gold'? '#d4af37' : it.id==='oil' ? '#ffa500' : '#7cfc00', tension: 0.3 }]},
      options: { responsive:true, maintainAspectRatio:false, plugins:{legend:{display:false}}, scales:{x:{display:false}, y:{display:false}}}
    });
  }
}
initCharts();

// Helpers
function nowStr(){ return new Date().toUTCString(); }
function updateTime(){ timeRow.textContent = nowStr(); }

// Fetch functions
async function fetchMetals(){
  try{
    const r = await fetch('https://api.metals.live/v1/spot');
    const data = await r.json();
    // data is array like [{gold:...},{silver:...},{oil:...},...]
    const goldObj = data.find(x=>x.gold);
    const oilObj = data.find(x=>x.oil);
    return { gold: goldObj?goldObj.gold:null, oil: oilObj?oilObj.oil:null };
  }catch(e){ console.error('metals',e); return {gold:null, oil:null}; }
}

async function fetchCrypto(){
  try{
    const ids='bitcoin';
    const url = `https://api.coingecko.com/api/v3/simple/price?ids=${ids}&vs_currencies=usd&include_24hr_change=true&include_market_cap=true`;
    const r = await fetch(url);
    const data = await r.json();
    return { bitcoin: data.bitcoin ? data.bitcoin : null };
  }catch(e){ console.error('crypto',e); return { bitcoin:null }; }
}

// Simple EUR/USD via exchangerate.host (free)
async function fetchEURUSD(){
  try{
    const r = await fetch('https://api.exchangerate.host/latest?base=EUR&symbols=USD');
    const d = await r.json();
    if(d && d.rates && d.rates.USD) return d.rates.USD;
    return null;
  }catch(e){ console.error('fx',e); return null; }
}

// Decision logic for BUY/SELL
function decideSignal(id, price){
  // use history short-term average
  const h = history[id].slice(-6); // last ~6 samples
  const avg = h.length ? h.reduce((s,x)=>s+x,0)/h.length : price;
  const diff = price - avg;
  const pct = avg ? (diff/avg)*100 : 0;
  // simple thresholds
  if(Math.abs(pct) < 0.02) return {dir:'WAIT', color:'wait', pct:Math.abs(pct).toFixed(2), risk:Math.max(5, (Math.abs(pct)*10).toFixed(0))};
  if(pct > 0.15) return {dir:'BUY', color:'buy', pct:pct.toFixed(2), risk: Math.max(5,Math.min(90, (10-pct).toFixed(0)))};
  if(pct < -0.15) return {dir:'SELL', color:'sell', pct:Math.abs(pct).toFixed(2), risk: Math.max(5,Math.min(90, (10-Math.abs(pct)).toFixed(0)))};
  // fallback
  return {dir:'WAIT', color:'wait', pct:Math.abs(pct).toFixed(2), risk:Math.max(5,Math.abs(pct)*10)};
}

// Whale detection simple: if recent absolute percent change spikes
let lastSpikeTime = 0;
function checkWhale(spike){
  const now = Date.now();
  if(spike > 0.8){ // >0.8% jump considered large (heuristic)
    lastSpikeTime = now;
    return true;
  }
  // if recent spike in last 90s, still warn
  if(now - lastSpikeTime < 90*1000) return true;
  return false;
}

// Update UI for an item
function updateUI(id, price, change){
  const pEl = document.getElementById(id+'-price');
  const dirEl = document.getElementById(id+'-dir');
  const metEl = document.getElementById(id+'-metrics');
  const indEl = document.getElementById(id+'-inds');

  if(price === null || isNaN(price)){ pEl.textContent = '—'; dirEl.textContent='—'; metEl.textContent='No data'; indEl.textContent='—'; return; }

  pEl.textContent = (typeof price==='number'? price.toFixed(2): price) + ' USD';
  // push history
  history[id].push(typeof price==='number'? price: parseFloat(price));
  if(history[id].length>12) history[id].shift();
  // update chart
  const ch = charts[id];
  if(ch){ ch.data.labels = history[id].map((_,i)=>i); ch.data.datasets[0].data = history[id]; ch.update(); }

  // signal
  const s = decideSignal(id, parseFloat(price));
  dirEl.textContent = s.dir; dirEl.className = 'direction ' + s.color;
  metEl.textContent = `${s.pct}% · risk ${s.risk}%`;
  indEl.textContent = (change!==undefined? `24h chg ${change.toFixed(2)}%` : '');
}

// Main refresh
async function refreshAll(){
  updateTime();
  statusText.textContent = 'Checking...';
  // fetch sources in parallel
  const [metals, crypto, eur] = await Promise.all([fetchMetals(), fetchCrypto(), fetchEURUSD()]);
  let any=false;
  // gold
  if(metals.gold){ updateUI('gold', Number(metals.gold), 0); any=true; } else updateUI('gold', null);
  // oil
  if(metals.oil){ updateUI('oil', Number(metals.oil), 0); any=true; } else updateUI('oil', null);
  // btc
  if(crypto.bitcoin){ updateUI('btc', Number(crypto.bitcoin.usd), crypto.bitcoin.usd_24h_change); any=true; } else updateUI('btc', null);
  // eur via forex
  if(eur){ updateUI('eur', Number(eur), 0); any=true; } else updateUI('eur', null);

  // whale detection: compute recent percent changes magnitudes
  let spike = 0;
  for(const id of ['gold','oil','btc']){
    const h = history[id];
    if(h.length>1){
      const prev = h[h.length-2], cur = h[h.length-1];
      const p = (Math.abs(cur - prev)/Math.max(prev,1))*100;
      spike = Math.max(spike, p);
    }
  }
  if(checkWhale(spike)){ whaleText.textContent = 'Whale Alert — Market unstable'; whaleBanner.style.background='linear-gradient(90deg, rgba(255,100,100,0.08), transparent)'; }
  else { whaleText.textContent = 'Market Normal'; whaleBanner.style.background='linear-gradient(90deg, rgba(212,175,55,0.06), transparent)'; }

  lastUpdate.textContent = 'Last update: ' + new Date().toLocaleTimeString();
  statusText.textContent = any ? 'Connected' : 'Offline';
}

// start
refreshAll();
setInterval(refreshAll, REFRESH_MS);

// buttons (language toggle simple demo)
document.getElementById('langBtn').addEventListener('click', ()=>{ 
  // simple switch — you can expand to real i18n
  const isAr = document.documentElement.lang === 'ar';
  document.documentElement.lang = isAr ? 'en' : 'ar';
  alert('Language switched (demo)');
});
document.getElementById('safeBtn').addEventListener('click', ()=>{ alert('Safe Mode toggled (demo)'); });

</script>
</body>
</html>
