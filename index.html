<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>ZY Smart Signal — Live</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="app" id="app">
    <header class="topbar">
      <div class="brand"><span class="zy">ZY</span><span class="tag">Smart Gold Signals</span></div>
      <div class="controls">
        <button id="notifBtn" class="icon" title="Notifications">🔔</button>
        <button id="langBtn" class="icon" title="Language">EN</button>
      </div>
    </header>

    <div id="timeRow" class="time"></div>

    <div id="whaleBanner" class="banner">
      <div class="bannerText" id="statusText">Status: Market Normal ✅</div>
      <button id="safeModeBtn" class="safeBtn">Safe Mode</button>
    </div>

    <main class="cards" id="cards">
      <div class="card" id="goldCard">
        <div class="card-left">
          <div class="symbol">XAU/USD</div>
          <div class="name">Gold</div>
        </div>
        <div class="card-right">
          <div class="price" id="goldPrice">Loading...</div>
        </div>
      </div>

      <div class="card" id="oilCard">
        <div class="card-left">
          <div class="symbol">WTI</div>
          <div class="name">Oil</div>
        </div>
        <div class="card-right">
          <div class="price" id="oilPrice">Loading...</div>
        </div>
      </div>

      <div class="card" id="btcCard">
        <div class="card-left">
          <div class="symbol">BTC/USD</div>
          <div class="name">Bitcoin</div>
        </div>
        <div class="card-right">
          <div class="price" id="btcPrice">Loading...</div>
        </div>
      </div>

      <div class="card" id="eurCard">
        <div class="card-left">
          <div class="symbol">EUR/USD</div>
          <div class="name">Euro</div>
        </div>
        <div class="card-right">
          <div class="price" id="eurPrice">Loading...</div>
        </div>
      </div>
    </main>

    <footer class="footer">
      <div class="powered">Powered by ZY AI System</div>
      <div class="timeSmall" id="updateTime">Last update: --</div>
    </footer>
  </div>

<script>
const API_KEY = "cpm5dsaad3ie4nvk5p7g"; // <-- حط هنا المفتاح ديالك
const symbols = {
  gold: "XAU/USD",
  oil: "OANDA:WTICOUSD",
  btc: "BINANCE:BTCUSDT",
  eur: "OANDA:EURUSD"
};

async function fetchPrice(symbol) {
  const url = `https://finnhub.io/api/v1/quote?symbol=${symbol}&token=${API_KEY}`;
  const res = await fetch(url);
  const data = await res.json();
  return data.c || null;
}

async function updatePrices() {
  document.getElementById("timeRow").textContent =
    new Date().toUTCString().replace("GMT", "UTC");

  try {
    const [gold, oil, btc, eur] = await Promise.all([
      fetchPrice("OANDA:XAUUSD"),
      fetchPrice("OANDA:WTICOUSD"),
      fetchPrice("BINANCE:BTCUSDT"),
      fetchPrice("OANDA:EURUSD")
    ]);

    document.getElementById("goldPrice").textContent = gold ? `${gold} USD` : "—";
    document.getElementById("oilPrice").textContent = oil ? `${oil} USD` : "—";
    document.getElementById("btcPrice").textContent = btc ? `${btc} USD` : "—";
    document.getElementById("eurPrice").textContent = eur ? `${eur}` : "—";

    document.getElementById("updateTime").textContent = 
      "Last update: " + new Date().toLocaleTimeString();
  } catch (err) {
    console.error("Error fetching:", err);
  }
}

// تحديث كل 15 ثانية
updatePrices();
setInterval(updatePrices, 15000);
</script>
</body>
</html>
